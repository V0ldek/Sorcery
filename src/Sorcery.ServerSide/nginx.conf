
user  nginx;
worker_processes  auto;
thread_pool default threads=8 max_queue=65536;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

worker_rlimit_nofile 100000;

events {
        worker_connections 65536;
        use epoll;
        multi_accept on;
}


http {
        ##
        # Basic Settings
        ##

        sendfile on;
        aio threads;
        directio 512;
        output_buffers 8 16k;

        tcp_nopush on;
        tcp_nodelay on;
        types_hash_max_size 2048;

        server_tokens off;

        ##
        # DDoS Settings
        ##
        limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
        limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

        reset_timedout_connection on;
        client_body_timeout 5s;
        client_header_timeout 5s;
        send_timeout 10s;
        keepalive_timeout 30s;

        proxy_cache_use_stale updating;

        ##
        # File Cache Settings
        ##

        open_file_cache max=4096 inactive=60s;
        open_file_cache_valid 300s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-asciicast;

        brotli on;
        brotli_comp_level 6;
        brotli_types application/atom+xml application/javascript application/json application/rss+xml
                     application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype
                     application/x-font-ttf application/x-javascript application/xhtml+xml application/xml
                     font/eot font/opentype font/otf font/truetype image/svg+xml image/vnd.microsoft.icon
                     image/x-icon image/x-win-bitmap text/css text/javascript text/plain text/xml
                     application/x-asciicast;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;

        server {
                listen 6980;
                server_name localhost;
                access_log off;

                location /stats {
                        stub_status on;
                        allow 127.0.0.1;
                        deny all;
                }
        }

        server {
                listen 80;
                server_name www.gienieczko.com www.v0ldek.com;

                location / {
                        return 301 $scheme://gienieczko.com$request_uri;
                }
        }

        server {
                listen 80;
                server_name gienieczko.com v0ldek.com;

                location / {
                        return 301 https://gienieczko.com$request_uri;
                }
        }

        server {
                listen 80;
                server_name dev.gienieczko.com dev.v0ldek.com;

                error_page 404 /404.html;

                location / {
                        root /var/site/sourcery-dev;

                        try_files $uri $uri/ =404;

                        include /etc/nginx/mime.types;
                        default_type application/octet-stream;

                        types {
                                application/x-asciicast cast;
                        }

                        location /_framework/ {
                                gzip_static on;
                                brotli_static on;
                        }
                }
        }

        server {
                # Rewrite trailing slashes to no trailing slashes.
                rewrite ^/(.*)/$ /$1 permanent;

                listen 443 ssl;
                server_name gienieczko.com v0ldek.com;

                ssl_certificate     /etc/letsencrypt/live/gienieczko.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/gienieczko.com/privkey.pem;

                limit_conn conn_limit_per_ip 20;
                limit_req zone=req_limit_per_ip burst=100 nodelay;

                location / {
                        root /var/site/sourcery;

                        include /etc/nginx/mime.types;
                        default_type application/octet-stream;
                        types {
                                application/x-asciicast cast;
                        }

                        location /_framework/ {
                                gzip_static on;
                                brotli_static on;
                        }
                        location /feed {
                                try_files /feed.rss =404;

                                default_type application/rss+xml;
                        }

                        location ~* .(pdf)$ {
                                expires 1d;
                        }

                        location ~* .(ico|jpg|jpeg|png|gif|css|swf|js|woff|woff2|webp|svg|mp4) {
                                access_log off;
                                add_header Cache-Control public;
                                expires 30d;

                                gzip_static on;
                                brotli_static on;
                        }

                        location /css/bundled/giscus.min.css /css/bundled/giscus-light.min.css {
                                default_type text/css;

                                add_header 'Access-Control-Allow-Origin' 'https://giscus.app' always;
                                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                        }

                        try_files $uri $uri.html $uri/index.html /media/$uri /media/$uri.pdf /media/$uri.mp4 =404;
                }
        }
}